services:
  - type: web
    name: ewelink-monitor-server
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SERVER_URL
        fromService:
          type: web
          name: ewelink-monitor-server
          property: host
      - key: EWELINK_APP_ID
        sync: false
      - key: EWELINK_APP_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        sync: false
    disk:
      name: ewelink-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
